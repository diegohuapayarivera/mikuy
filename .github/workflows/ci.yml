name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
      # Dependencias vulnerables: un hallazgo alto o crítico bloquea.
      - run: npm audit --audit-level=high

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks sobre todo el historial; cualquier hallazgo bloquea. Excepciones en .gitleaks.toml.
      - name: gitleaks
        env:
          VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          archivo="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${archivo}"
          curl -sSfLO "${base}/gitleaks_${VERSION}_checksums.txt"
          sha256sum -c --ignore-missing "gitleaks_${VERSION}_checksums.txt"
          tar -xzf "${archivo}" gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Supabase propio del CI, con Docker (nunca en la máquina de Diego). Solo lo necesario para
      # pgTAP: Postgres y Auth (crea auth.users).
      - run: >-
          npx supabase start
          -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: npx supabase test db
