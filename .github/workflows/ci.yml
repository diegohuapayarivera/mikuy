name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
      # Dependencias vulnerables: un hallazgo alto o crítico bloquea.
      - run: npm audit --audit-level=high

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks sobre todo el historial; cualquier hallazgo bloquea. Excepciones en .gitleaks.toml.
      - name: gitleaks
        env:
          VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          archivo="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${archivo}"
          curl -sSfLO "${base}/gitleaks_${VERSION}_checksums.txt"
          sha256sum -c --ignore-missing "gitleaks_${VERSION}_checksums.txt"
          tar -xzf "${archivo}" gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Supabase propio del CI, con Docker (nunca en la máquina de Diego). Solo lo necesario para
      # pgTAP: Postgres y Auth (crea auth.users).
      - run: >-
          npx supabase start
          -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: npx supabase test db
      # El demo no tiene pg_graphql; sin él, el CI ve los mismos avisos que el demo.
      - run: docker exec supabase_db_mikuy psql -U supabase_admin -d postgres -q -c 'drop extension if exists pg_graphql cascade'
      # Definición de terminado: avisos de seguridad de Supabase (splinter) en cero para Mikuy.
      - name: Avisos de seguridad en cero
        env:
          SPLINTER_COMMIT: fccca4b1c4d8b48b8ccd69bd6b30e84adcb92975
          SPLINTER_SHA256: d8d558baad3e03832e521c527907fa50a9a172fabd899dd0f5c2504a5a0e9349
        run: |
          curl -sSfL -o splinter.sql "https://raw.githubusercontent.com/supabase/splinter/${SPLINTER_COMMIT}/splinter.sql"
          echo "${SPLINTER_SHA256}  splinter.sql" | sha256sum -c -
          { echo "begin;"; echo "set local pgrst.db_schemas = 'public,graphql_public,mikuy';"; cat splinter.sql; echo ";"; echo "rollback;"; } > lint.sql
          docker exec -i supabase_db_mikuy psql -U postgres -d postgres -q -v ON_ERROR_STOP=1 --csv < lint.sql > avisos.csv
          python3 - avisos.csv <<'PY'
          import csv, json, sys
          avisos = [
              f for f in csv.DictReader(open(sys.argv[1]))
              if 'SECURITY' in f['categories']
              and json.loads(f['metadata'] or '{}').get('schema') in ('mikuy', 'mikuy_privado')
          ]
          for a in avisos:
              print(f"{a['level']} {a['name']}: {a['detail']}")
          print(f"{len(avisos)} avisos de seguridad en mikuy")
          sys.exit(1 if avisos else 0)
          PY
      # El seed no duplica: dos corridas dejan los mismos conteos.
      - name: Seed de Sabor de Morenas, dos veces
        env:
          MIKUY_DB_CI: '1'
        run: |
          printf 'si\n' | node scripts/db-seed-demo.ts | tail -1 | tee conteo-1.txt
          printf 'si\n' | node scripts/db-seed-demo.ts | tail -1 | tee conteo-2.txt
          diff conteo-1.txt conteo-2.txt
          grep -q '93 platos, 119 presentaciones, 12 mesas' conteo-1.txt
